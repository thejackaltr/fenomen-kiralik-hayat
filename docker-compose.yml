# Dokploy (project "fenomen"): builds the Dockerfile and serves the game on teserix_network.
# The Cloudflare Tunnel routes fenomen.teserix.com to http://fenomen-web:80.
services:
  web:
    build:
      context: .
      # Umami: set these in the Dokploy project environment (not in the repo). Empty = analytics off.
      args:
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_DOMAINS: ${VITE_UMAMI_DOMAINS:-}
    restart: unless-stopped
    mem_limit: 64m
    networks:
      teserix_network:
        aliases:
          - fenomen-web

networks:
  teserix_network:
    external: true
